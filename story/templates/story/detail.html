<!DOCTYPE html>
<html>
<head><title>{{ story.title }}</title></head>
<body style="font-family: sans-serif; text-align:center; padding:20px;">
<h1>{{ story.title }}</h1>
{% if story.image_url %}
<img src="{{ story.image_url }}" width="400" style="border-radius:15px; border:2px solid orange;">
<br><br>
{% endif %}
<p>{{ story.content }}</p>
<br>
<a href="/" style="background:orange; color:white; padding:10px 20px; text-decoration:none; border-radius:8px;">Go Home</a>
</body>
</html>
